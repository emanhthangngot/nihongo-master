<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NihongoMaster — Flashcards</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.study-page{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,rgba(249,115,22,.06) 0%,transparent 60%),var(--bg)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:.85rem 2rem;border-bottom:1px solid rgba(255,255,255,.06)}
.progress-line{position:absolute;top:0;left:0;height:3px;background:var(--ember);border-radius:0 9999px 9999px 0;transition:width .4s ease}
.card-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;perspective:1200px}
.card-wrap{width:100%;max-width:520px;position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.card-wrap.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem}
.card-front{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.card-back{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);transform:rotateY(180deg);justify-content:flex-start}
.word-display{font-family:var(--font-jp);font-size:5rem;line-height:1;color:var(--fg)}
.tap-hint{font-size:.8125rem;color:var(--muted);margin-top:2rem;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.7}50%{opacity:.3}}
.rating-row{display:flex;gap:.6rem;width:100%;justify-content:center;margin-top:1.5rem}
.r-btn{flex:1;max-width:100px;padding:.65rem .5rem;border-radius:.75rem;font-size:.8rem;border:1px solid;background:rgba(255,255,255,.02);backdrop-filter:blur(4px);color:var(--fg);font-family:var(--font-b);cursor:pointer;transition:transform .15s,background .2s}
.r-btn:hover{transform:scale(1.05)}
.r-again{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.06)}
.r-hard{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.06)}
.r-good{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06)}
.r-easy{border-color:hsl(162,60%,45%);background:rgba(52,211,153,.12);font-weight:500}
.divider{width:100%;height:1px;background:rgba(255,255,255,.08);margin:1rem 0}
.examples{width:100%;text-align:left}
.ex-item{margin-bottom:.75rem}
.kb-hints{text-align:center;padding:1rem;font-size:.7rem;color:rgba(255,255,255,.25);letter-spacing:.05em}
.session-done{text-align:center;padding:4rem 2rem;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

const CARDS=[
  {word:'食べる',reading:'たべる',romaji:'taberu',meaning:'to eat',pos:'verb (godan)',jlpt:'N5',
   examples:[{jp:'毎日野菜を食べる。',en:'I eat vegetables every day.'},
             {jp:'もっと食べたい。',en:'I want to eat more.'},
             {jp:'何を食べましたか？',en:'What did you eat?'}]},
  {word:'勉強',reading:'べんきょう',romaji:'benkyō',meaning:'study; to study',pos:'noun / suru-verb',jlpt:'N5',
   examples:[{jp:'毎日日本語を勉強する。',en:'I study Japanese every day.'},
             {jp:'勉強は大切だ。',en:'Studying is important.'},
             {jp:'何時間勉強しましたか？',en:'How many hours did you study?'}]},
  {word:'難しい',reading:'むずかしい',romaji:'muzukashii',meaning:'difficult; hard',pos:'i-adjective',jlpt:'N5',
   examples:[{jp:'この問題は難しい。',en:'This problem is difficult.'},
             {jp:'日本語は難しくない。',en:'Japanese is not difficult.'},
             {jp:'難しい質問だ。',en:'That\'s a hard question.'}]},
  {word:'先生',reading:'せんせい',romaji:'sensei',meaning:'teacher; master; doctor',pos:'noun',jlpt:'N5',
   examples:[{jp:'先生はどこですか？',en:'Where is the teacher?'},
             {jp:'田中先生は優しい。',en:'Teacher Tanaka is kind.'},
             {jp:'先生に聞いてください。',en:'Please ask the teacher.'}]},
  {word:'分かる',reading:'わかる',romaji:'wakaru',meaning:'to understand; to be clear',pos:'verb (godan)',jlpt:'N5',
   examples:[{jp:'分かりますか？',en:'Do you understand?'},
             {jp:'全然分からない。',en:'I don\'t understand at all.'},
             {jp:'今は分かった。',en:'Now I understand.'}]},
];

function AudioBtn(){
  return(
    <button className="icon-btn" style={{padding:'.3rem'}} onClick={e=>{e.stopPropagation();}} title="Play audio">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>
  );
}

function FlashCard({card,onRate,sessionIdx,total}){
  const [flipped,setFlipped]=useState(false);
  useEffect(()=>setFlipped(false),[card]);
  useEffect(()=>{
    const handler=e=>{
      if(e.key===' '){e.preventDefault();setFlipped(f=>!f);}
      if(flipped){
        if(e.key==='1')onRate('again');
        if(e.key==='2')onRate('hard');
        if(e.key==='3')onRate('good');
        if(e.key==='4')onRate('easy');
      }
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[flipped,onRate]);

  return(
    <div className="card-stage">
      <div style={{width:'100%',maxWidth:'520px'}}>
        <div className={`card-wrap${flipped?' flipped':''}`} onClick={()=>setFlipped(f=>!f)} style={{cursor:'pointer'}}>
          {/* Front */}
          <div className="card-face card-front">
            <span className="jlpt n5" style={{marginBottom:'1.5rem'}}>{card.jlpt}</span>
            <div className="word-display">{card.word}</div>
            <div className="tap-hint">tap to reveal</div>
          </div>
          {/* Back */}
          <div className="card-face card-back" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',gap:'.75rem',width:'100%'}}>
              <span style={{fontFamily:'var(--font-jp)',fontSize:'2.25rem'}}>{card.word}</span>
              <AudioBtn/>
              <span className="jlpt n5" style={{marginLeft:'auto'}}>{card.jlpt}</span>
            </div>
            <div style={{fontFamily:'var(--font-m)',fontSize:'.8125rem',color:'var(--muted)',marginTop:'.3rem',alignSelf:'flex-start'}}>{card.romaji} · {card.pos}</div>
            <div className="divider"/>
            <div style={{fontFamily:'var(--font-d)',fontSize:'2rem',alignSelf:'flex-start',lineHeight:1.1}}>{card.meaning}</div>
            <div className="examples" style={{marginTop:'1rem'}}>
              <div style={{fontSize:'.65rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'.5rem'}}>Example sentences</div>
              {card.examples.map((ex,i)=>(
                <div key={i} className="ex-item">
                  <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                    <span style={{fontFamily:'var(--font-jp)',fontSize:'.9rem'}}>{ex.jp}</span>
                    <AudioBtn/>
                  </div>
                  <div style={{fontSize:'.75rem',color:'var(--muted)',marginTop:'.15rem'}}>{ex.en}</div>
                </div>
              ))}
            </div>
            <div className="rating-row">
              <button className="r-btn r-again" onClick={()=>onRate('again')}>Again<div style={{fontSize:'.6rem',opacity:.6,marginTop:'.2rem'}}>[1]</div></button>
              <button className="r-btn r-hard" onClick={()=>onRate('hard')}>Hard<div style={{fontSize:'.6rem',opacity:.6,marginTop:'.2rem'}}>[2]</div></button>
              <button className="r-btn r-good" onClick={()=>onRate('good')}>Good<div style={{fontSize:'.6rem',opacity:.6,marginTop:'.2rem'}}>[3]</div></button>
              <button className="r-btn r-easy" onClick={()=>onRate('easy')}>Easy<div style={{fontSize:'.6rem',opacity:.6,marginTop:'.2rem'}}>[4]</div></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [idx,setIdx]=useState(0);
  const [done,setDone]=useState(false);
  const [ratings,setRatings]=useState([]);
  const [paused,setPaused]=useState(false);
  const total=CARDS.length;
  const progress=idx/total;

  const onRate=useCallback(rating=>{
    setRatings(r=>[...r,{card:CARDS[idx].word,rating}]);
    if(idx+1>=total)setDone(true);
    else setIdx(i=>i+1);
  },[idx,total]);

  if(done){
    const pct=Math.round(ratings.filter(r=>r.rating==='good'||r.rating==='easy').length/total*100);
    return(
      <div className="study-page">
        <div className="top-bar">
          <a href="Dashboard.html" style={{color:'var(--muted)',fontSize:'.8125rem'}}>← Dashboard</a>
        </div>
        <div className="session-done fr">
          <div style={{fontFamily:'var(--font-jp)',fontSize:'5rem',color:'var(--muted)',lineHeight:1}}>完了</div>
          <div style={{fontFamily:'var(--font-d)',fontSize:'2.5rem',marginTop:'.75rem'}}>Session Complete!</div>
          <div style={{color:'var(--muted)',marginTop:'.5rem'}}>{total} cards reviewed · {pct}% correct</div>
          <div style={{display:'flex',gap:'.75rem',marginTop:'2rem'}}>
            <button className="lg btn btn-ember" onClick={()=>{setIdx(0);setDone(false);setRatings([]);}}>Review Again</button>
            <a href="Dashboard.html" className="lg btn">← Dashboard</a>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="study-page">
      {/* Top progress line */}
      <div style={{position:'relative',height:'3px',background:'var(--border)'}}>
        <div className="progress-line" style={{width:`${progress*100}%`}}/>
      </div>
      <div className="top-bar">
        <div style={{fontSize:'.8125rem',color:'var(--muted)',display:'flex',gap:'1.5rem'}}>
          <span>Due: <strong style={{color:'var(--fg)'}}>47</strong></span>
          <span>Session: <strong style={{color:'var(--fg)'}}>{idx+1}/{total}</strong></span>
        </div>
        <div style={{fontFamily:'var(--font-jp)',fontSize:'1rem',color:'var(--muted)'}}>{CARDS[idx].word}</div>
        <button className="lg btn btn-sm" onClick={()=>setPaused(p=>!p)}>{paused?'▶ Resume':'⏸ Pause'}</button>
      </div>
      <FlashCard card={CARDS[idx]} onRate={onRate} sessionIdx={idx} total={total}/>
      <div className="kb-hints">Space — flip &nbsp;·&nbsp; 1 Again &nbsp;·&nbsp; 2 Hard &nbsp;·&nbsp; 3 Good &nbsp;·&nbsp; 4 Easy</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
