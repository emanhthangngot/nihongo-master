<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NihongoMaster — Dashboard</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.page{min-height:100vh;padding-bottom:80px}
.main{max-width:80rem;margin:0 auto;padding:2rem 2rem 3rem}
.bento{display:grid;gap:1.25rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}
@media(max-width:900px){.row3,.row2{grid-template-columns:1fr}}
.resume-card{border-radius:1.5rem;padding:2.25rem;position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(0,30,60,.85),rgba(0,10,30,.9));border:1px solid rgba(255,255,255,.08)}
.resume-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,rgba(249,115,22,.12) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(56,189,248,.08) 0%,transparent 50%);z-index:0}
.resume-content{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.srs-num{font-family:var(--font-d);font-size:3.5rem;line-height:1;color:var(--fg)}
.week-dots{display:flex;gap:.5rem;margin-top:.75rem;align-items:center}
.dot{width:1.5rem;height:1.5rem;border-radius:9999px}
.dot.done{background:var(--ember)}
.dot.miss{background:none;border:1px solid var(--border)}
.week-labels{display:flex;gap:.5rem;margin-top:.3rem}
.week-labels span{width:1.5rem;text-align:center;font-size:.65rem;color:var(--muted)}
.heatmap{display:grid;grid-template-columns:repeat(52,1fr);gap:2px;margin-top:.75rem}
.hm-cell{width:100%;aspect-ratio:1;border-radius:2px;cursor:pointer;transition:opacity .15s}
.hm-cell:hover{opacity:.7}
.act-item{display:flex;align-items:flex-start;gap:.75rem;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.act-item:last-child{border-bottom:none}
.weak-item{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;border-radius:.75rem;margin-bottom:.5rem}
.ret-bar{width:80px;height:4px;border-radius:9999px;background:var(--border);overflow:hidden;display:inline-block}
.ret-fill{height:100%;border-radius:9999px}
.xp-level{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;padding:.2rem .6rem;border-radius:9999px;background:rgba(249,115,22,.15);color:var(--ember);border:1px solid rgba(249,115,22,.3)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

function Navbar(){
  return(
    <nav className="navbar lg">
      <div className="navbar-inner">
        <a href="../Velorah Hero.html" className="logo">Nihongo<em style={{fontStyle:'normal',color:'var(--muted)'}}>Master</em><sup>®</sup></a>
        <ul className="nav-links">
          <li><a href="Dashboard.html" className="active">Dashboard</a></li>
          <li><a href="Learning Path.html">Path</a></li>
          <li><a href="AI Tutor.html">Tutor</a></li>
          <li><a href="Flashcards.html">Flashcards</a></li>
          <li><a href="Dictionary.html">Dictionary</a></li>
        </ul>
        <div className="nav-right">
          <div className="streak keep-mobile">🔥 12</div>
          <button className="icon-btn" title="Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button className="lg nav-cta btn">Quick Practice</button>
          <div className="avatar">你</div>
        </div>
      </div>
    </nav>
  );
}

function MobileNav(){
  return(
    <nav className="mobile-nav lg">
      <a href="Dashboard.html" className="active"><span style={{fontSize:'1.1rem'}}>🏠</span><span>Home</span></a>
      <a href="Learning Path.html"><span style={{fontSize:'1.1rem'}}>📚</span><span>Path</span></a>
      <a href="Flashcards.html"><span style={{fontSize:'1.1rem'}}>🃏</span><span>Cards</span></a>
      <a href="AI Tutor.html"><span style={{fontSize:'1.1rem'}}>🤖</span><span>Tutor</span></a>
      <a href="Dictionary.html"><span style={{fontFamily:'var(--font-jp)',fontSize:'1rem'}}>辞</span><span>Dict</span></a>
    </nav>
  );
}

function XPBar({current,max,className=''}){
  return(
    <div className={`xpbar-track ${className}`}>
      <div className="xpbar-fill" style={{width:`${Math.min(100,(current/max)*100)}%`}}/>
    </div>
  );
}

function ResumeCard(){
  return(
    <div className="resume-card fr">
      <div className="resume-bg"/>
      <div className="resume-content">
        <div>
          <div style={{fontSize:'.75rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.1em'}}>Continue where you left off</div>
          <div style={{fontFamily:'var(--font-d)',fontSize:'2rem',marginTop:'.4rem',lineHeight:1.1}}>N4 Grammar — Lesson 7: て-form</div>
          <div style={{fontSize:'.8125rem',color:'var(--muted)',marginTop:'.5rem'}}>Last studied: 2 hours ago · Progress: 68%</div>
          <XPBar current={68} max={100} className="mt-1" style={{marginTop:'.75rem',width:'280px'}}/>
        </div>
        <a href="Flashcards.html" className="lg btn btn-ember" style={{whiteSpace:'nowrap',flexShrink:0}}>Resume →</a>
      </div>
    </div>
  );
}

function SRSCard(){
  return(
    <div className="lg card fr1" style={{borderRadius:'1.25rem'}}>
      <div style={{fontSize:'.7rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.12em'}}>Today's Reviews</div>
      <div className="srs-num" style={{marginTop:'.5rem'}}>47</div>
      <div style={{fontSize:'.8125rem',color:'var(--muted)'}}>cards due now</div>
      <div style={{fontSize:'.8125rem',color:'var(--ember)',marginTop:'.25rem'}}>+ 15 new</div>
      <XPBar current={14} max={20} className="" style={{marginTop:'1rem'}}/>
      <div style={{fontSize:'.7rem',color:'var(--muted)',marginTop:'.3rem'}}>70% of daily goal</div>
      <a href="Flashcards.html" className="lg btn btn-ember" style={{display:'block',textAlign:'center',marginTop:'1rem',width:'100%'}}>Begin Review →</a>
    </div>
  );
}

function StreakCard(){
  const days=['M','T','W','T','F','S','S'];
  const done=[true,true,true,true,true,false,false];
  return(
    <div className="lg card fr2" style={{borderRadius:'1.25rem',display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center'}}>
      <div style={{fontSize:'3rem',lineHeight:1}}>🔥</div>
      <div style={{fontFamily:'var(--font-d)',fontSize:'3rem',color:'var(--fg)',lineHeight:1.1}}>12</div>
      <div style={{fontSize:'.8125rem',color:'var(--muted)',marginTop:'.25rem'}}>Day Streak</div>
      <div className="week-dots" style={{marginTop:'1rem'}}>
        {days.map((d,i)=><div key={i} className={`dot ${done[i]?'done':'miss'}`}/>)}
      </div>
      <div className="week-labels">
        {days.map((d,i)=><span key={i}>{d}</span>)}
      </div>
      <div style={{fontSize:'.75rem',color:'var(--muted)',marginTop:'.75rem'}}>🔥 Keep going — 3 days to record!</div>
    </div>
  );
}

function XPCard(){
  return(
    <div className="lg card fr3" style={{borderRadius:'1.25rem'}}>
      <div style={{fontFamily:'var(--font-d)',fontSize:'2.5rem',lineHeight:1}}>1,240 <span style={{fontSize:'1.5rem'}}>XP</span></div>
      <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginTop:'.4rem'}}>
        <span className="xp-level">Level 8</span>
        <span style={{fontSize:'.8125rem',color:'var(--muted)'}}>Scholar</span>
      </div>
      <XPBar current={620} max={1000} className="" style={{marginTop:'1rem'}}/>
      <div style={{fontSize:'.7rem',color:'var(--muted)',marginTop:'.3rem'}}>620 / 1,000 XP to Level 9</div>
      <div style={{marginTop:'1.25rem'}}>
        {[['Grammar','hsl(162,60%,45%)',82],['Kanji','var(--ember)',61],['Vocabulary','hsl(340,70%,68%)',74]].map(([label,color,pct])=>(
          <div key={label} style={{display:'flex',alignItems:'center',gap:'.75rem',marginBottom:'.6rem'}}>
            <div style={{width:'70px',fontSize:'.75rem',color:'var(--muted)'}}>{label}</div>
            <div style={{flex:1,height:'4px',borderRadius:'9999px',background:'var(--border)',overflow:'hidden'}}>
              <div style={{height:'100%',borderRadius:'9999px',background:color,width:`${pct}%`}}/>
            </div>
            <div style={{width:'28px',fontSize:'.7rem',color:'var(--muted)',textAlign:'right'}}>{pct}%</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const WEAK=[
  {word:'食べる',reading:'たべる',romaji:'taberu',ret:68},
  {word:'先生',reading:'せんせい',romaji:'sensei',ret:54},
  {word:'学校',reading:'がっこう',romaji:'gakkō',ret:72},
  {word:'難しい',reading:'むずかしい',romaji:'muzukashii',ret:45},
  {word:'勉強',reading:'べんきょう',romaji:'benkyō',ret:61},
];
function WeakPanel(){
  return(
    <div className="lg card fr1" style={{borderRadius:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
        <span style={{fontFamily:'var(--font-d)',fontSize:'1.1rem'}}>Needs Attention</span>
        <span style={{fontSize:'.7rem',padding:'.2rem .55rem',borderRadius:'9999px',background:'rgba(249,115,22,.15)',color:'var(--ember)',border:'1px solid rgba(249,115,22,.3)'}}>{WEAK.length}</span>
      </div>
      <div style={{maxHeight:'220px',overflowY:'auto'}}>
        {WEAK.map(w=>{
          const color=w.ret<60?'#ef4444':w.ret<75?'#f59e0b':'var(--jade)';
          return(
            <div key={w.word} className="weak-item lg">
              <div>
                <span style={{fontFamily:'var(--font-jp)',fontSize:'1.1rem'}}>{w.word}</span>
                <span style={{fontSize:'.7rem',color:'var(--muted)',marginLeft:'.5rem'}}>{w.romaji}</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                <div className="ret-bar"><div className="ret-fill" style={{width:`${w.ret}%`,background:color}}/></div>
                <span style={{fontSize:'.7rem',color,width:'30px'}}>{w.ret}%</span>
                <a href="Flashcards.html" className="lg btn btn-sm" style={{fontSize:'.7rem',padding:'.25rem .6rem'}}>Study</a>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const ACTIVITY=[
  {icon:'📚',text:'Completed: N4 Lesson 6 — て-form Expressions',time:'2h ago'},
  {icon:'🃏',text:'SRS Review: 45 cards · 89% correct',time:'Yesterday'},
  {icon:'🏆',text:'Achievement: 10-Day Streak Unlocked!',time:'2 days ago'},
  {icon:'📖',text:'Read: 桜の下で — Comprehension 4/5',time:'3 days ago'},
  {icon:'🤖',text:'AI Tutor: 18-min grammar session',time:'4 days ago'},
];
function ActivityFeed(){
  return(
    <div className="lg card fr2" style={{borderRadius:'1.25rem'}}>
      <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',marginBottom:'1rem'}}>Recent Activity</div>
      {ACTIVITY.map((a,i)=>(
        <div key={i} className="act-item">
          <span style={{fontSize:'1.1rem',flexShrink:0,marginTop:'.1rem'}}>{a.icon}</span>
          <div>
            <div style={{fontSize:'.8rem',lineHeight:1.4}}>{a.text}</div>
            <div style={{fontSize:'.7rem',color:'var(--muted)',marginTop:'.2rem'}}>{a.time}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function Heatmap(){
  const today=new Date();
  const cells=[];
  for(let w=51;w>=0;w--){
    for(let d=0;d<7;d++){
      const date=new Date(today);
      date.setDate(date.getDate()-w*7-d);
      const count=Math.floor(Math.random()*45);
      cells.push({date,count});
    }
  }
  const color=n=>{
    if(!n)return'var(--border)';
    if(n<6)return'rgba(249,115,22,.25)';
    if(n<16)return'rgba(249,115,22,.5)';
    if(n<31)return'rgba(249,115,22,.75)';
    return'var(--ember)';
  };
  return(
    <div className="lg card fr3" style={{borderRadius:'1.25rem'}}>
      <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',marginBottom:'1rem'}}>Review Activity</div>
      <div className="heatmap">{cells.map((c,i)=>(
        <div key={i} className="hm-cell" style={{background:color(c.count)}} title={`${c.date.toDateString()}: ${c.count} cards`}/>
      ))}</div>
      <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginTop:'.75rem',fontSize:'.7rem',color:'var(--muted)'}}>
        <span>Less</span>
        {['var(--border)','rgba(249,115,22,.25)','rgba(249,115,22,.5)','rgba(249,115,22,.75)','var(--ember)'].map((c,i)=>(
          <div key={i} style={{width:'12px',height:'12px',borderRadius:'2px',background:c}}/>
        ))}
        <span>More</span>
      </div>
    </div>
  );
}

function App(){
  return(
    <div className="page">
      <Navbar/>
      <main className="main">
        <div style={{marginBottom:'1.5rem',lineHeight:1.2}} className="fr">
          <span style={{fontFamily:'var(--font-jp)',fontSize:'2rem'}}>おはようございます</span>
          <span style={{fontFamily:'var(--font-d)',fontSize:'2rem'}}>, Scholar 🌸</span>
        </div>
        <div className="bento">
          <ResumeCard/>
          <div className="row3">
            <SRSCard/>
            <StreakCard/>
            <XPCard/>
          </div>
          <div className="row2">
            <WeakPanel/>
            <ActivityFeed/>
          </div>
          <Heatmap/>
        </div>
      </main>
      <MobileNav/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
