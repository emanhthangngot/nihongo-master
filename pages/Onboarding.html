<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NihongoMaster — Begin Your Path</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.ob-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse at 50% 0%,rgba(249,115,22,.08) 0%,transparent 60%),var(--bg)}
.progress-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--border);z-index:100}
.progress-fill{height:100%;background:var(--ember);border-radius:0 9999px 9999px 0;transition:width .5s ease}
.ob-logo{position:fixed;top:1.25rem;left:2rem;font-family:var(--font-d);font-size:1.4rem}
.step{width:100%;max-width:520px;animation:fade-rise .5s ease-out both}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin:1.75rem 0}
@media(max-width:480px){.goal-grid{grid-template-columns:1fr}}
.goal-card{border-radius:1.25rem;padding:1.5rem;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.02)}
.goal-card:hover{border-color:rgba(255,255,255,.2);transform:scale(1.02)}
.goal-card.selected{border-color:var(--ember);background:rgba(249,115,22,.1);box-shadow:0 0 20px rgba(249,115,22,.2)}
.level-pills{display:flex;gap:.6rem;margin:1.5rem 0;flex-wrap:wrap}
.level-pill{border-radius:9999px;padding:.5rem 1.25rem;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:.9rem}
.level-pill:hover{border-color:rgba(255,255,255,.3)}
.level-pill.selected{border-color:var(--ember);background:rgba(249,115,22,.15);color:var(--fg)}
.level-info{border-radius:1rem;padding:1.25rem;margin-bottom:1.5rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
.q-card{border-radius:1rem;padding:.9rem 1.1rem;cursor:pointer;margin-bottom:.6rem;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.02)}
.q-card:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.q-card.correct{border-color:var(--jade);background:rgba(52,211,153,.1);pointer-events:none}
.q-card.wrong{border-color:#ef4444;background:rgba(239,68,68,.08);pointer-events:none}
.result-screen{text-align:center;animation:fade-rise .6s ease-out both}
.progress-ring{transform:rotate(-90deg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

const GOALS=[
  {id:'jlpt',icon:'📖',label:'Pass JLPT (N5 → N1)',desc:'Structured exam prep'},
  {id:'speak',icon:'💬',label:'Speak Naturally',desc:'Conversational fluency'},
  {id:'travel',icon:'✈️',label:'Travel Japan',desc:'Practical daily Japanese'},
  {id:'anime',icon:'🎌',label:'Love Anime / Manga',desc:'Cultural immersion'},
];

const LEVEL_INFO={
  N5:{vocab:'800',kanji:'100',time:'~3 months',desc:'Absolute beginner friendly'},
  N4:{vocab:'1,500',kanji:'300',time:'~6 months',desc:'Covers basic daily conversation'},
  N3:{vocab:'3,750',kanji:'650',time:'~1 year',desc:'Intermediate everyday topics'},
  N2:{vocab:'6,000',kanji:'1,000',time:'~2 years',desc:'Near-business level Japanese'},
  N1:{vocab:'10,000+',kanji:'2,000',time:'~3–4 years',desc:'Near-native comprehension'},
};

const QUESTIONS=[
  {jp:'食べる',gloss:'What does this word mean?',options:['to drink','to sleep','to eat','to walk'],correct:2,jlpt:'N5'},
  {jp:'大きい',gloss:'What is the meaning?',options:['small','big','fast','quiet'],correct:1,jlpt:'N5'},
  {jp:'どこ',gloss:'Which question word is this?',options:['when','who','where','what'],correct:2,jlpt:'N5'},
  {jp:'学校',gloss:'What does this word mean?',options:['company','hospital','school','station'],correct:2,jlpt:'N5'},
  {jp:'ありがとう',gloss:'What does this expression mean?',options:['goodbye','thank you','I\'m sorry','good morning'],correct:1,jlpt:'N5'},
  {jp:'先生が教えています',gloss:'What is happening in this sentence?',options:['A student is learning','A teacher is teaching','A teacher is sleeping','A student is eating'],correct:1,jlpt:'N4'},
  {jp:'〜てから',gloss:'What does this grammar pattern mean?',options:['while doing ~','before doing ~','after doing ~','without doing ~'],correct:2,jlpt:'N4'},
  {jp:'もし雨が降ったら、家にいます',gloss:'What does this sentence express?',options:['A fact','A command','A wish','A conditional'],correct:3,jlpt:'N4'},
];

function ProgressBar({step,total}){
  return(
    <div className="progress-bar">
      <div className="progress-fill" style={{width:`${(step/total)*100}%`}}/>
    </div>
  );
}

function Step1({onNext}){
  const [selected,setSelected]=useState(null);
  return(
    <div className="step">
      <div style={{fontFamily:'var(--font-d)',fontSize:'2.25rem',lineHeight:1.1,marginBottom:'.6rem'}} className="fr">
        What brings you to Japanese?
      </div>
      <div style={{color:'var(--muted)',fontSize:'.9rem',lineHeight:1.6}} className="fr1">
        We'll shape your path to match your purpose.
      </div>
      <div className="goal-grid fr2">
        {GOALS.map(g=>(
          <div key={g.id} className={`goal-card lg${selected===g.id?' selected':''}`} onClick={()=>setSelected(g.id)}>
            <div style={{fontSize:'2.25rem',marginBottom:'.75rem'}}>{g.icon}</div>
            <div style={{fontSize:'1rem',fontWeight:500,color:'var(--fg)'}}>{g.label}</div>
            <div style={{fontSize:'.78rem',color:'var(--muted)',marginTop:'.3rem'}}>{g.desc}</div>
          </div>
        ))}
      </div>
      <button
        className={`lg btn btn-lg${selected?' btn-ember':''}`}
        style={{width:'100%',opacity:selected?1:.4,pointerEvents:selected?'auto':'none'}}
        onClick={()=>onNext(selected)}>
        Continue →
      </button>
    </div>
  );
}

function Step2({goal,onNext}){
  const [level,setLevel]=useState('N5');
  const info=LEVEL_INFO[level];
  return(
    <div className="step">
      <div style={{fontFamily:'var(--font-d)',fontSize:'2.25rem',lineHeight:1.1,marginBottom:'.6rem'}} className="fr">
        Which level are you aiming for?
      </div>
      <div style={{color:'var(--muted)',fontSize:'.9rem',marginBottom:'.5rem'}} className="fr1">
        You can always change this later.
      </div>
      <div className="level-pills fr2">
        {Object.keys(LEVEL_INFO).map(l=>(
          <button key={l} className={`level-pill lg${level===l?' selected':''}`} onClick={()=>setLevel(l)}>{l}</button>
        ))}
      </div>
      {level&&(
        <div className="level-info fr3">
          <div style={{display:'flex',gap:'2rem',flexWrap:'wrap',marginBottom:'.75rem'}}>
            <div><div style={{fontSize:'.68rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Vocabulary</div><div style={{fontSize:'1.1rem',fontWeight:500}}>{info.vocab} words</div></div>
            <div><div style={{fontSize:'.68rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Kanji</div><div style={{fontSize:'1.1rem',fontWeight:500}}>{info.kanji} chars</div></div>
            <div><div style={{fontSize:'.68rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Study time</div><div style={{fontSize:'1.1rem',fontWeight:500}}>{info.time}</div></div>
          </div>
          <div style={{fontSize:'.82rem',color:'var(--muted)'}}>{info.desc}</div>
        </div>
      )}
      <button className="lg btn btn-lg btn-ember" style={{width:'100%'}} onClick={()=>onNext(level)}>
        Continue →
      </button>
    </div>
  );
}

function Step3({goal,level}){
  const label=goal==='jlpt'?`JLPT ${level} Path`:goal==='speak'?'Conversational Path':goal==='travel'?'Travel Japanese Path':'Anime & Manga Path';
  const items=goal==='jlpt'?[
    `Personalized ${level} skill tree`,
    'Grammar, Kanji & Vocabulary tracks',
    'SRS flashcards tuned to your level',
    'AI Tutor ready for practice',
  ]:[
    'Curated conversation lessons',
    'Essential vocabulary SRS deck',
    'AI Tutor for speaking practice',
    'Graded reading library',
  ];
  return(
    <div className="result-screen">
      <div style={{fontSize:'3rem',marginBottom:'1rem'}}>🌸</div>
      <div style={{fontFamily:'var(--font-d)',fontSize:'2.5rem',lineHeight:1.1,marginBottom:'.6rem'}}>Your path is ready.</div>
      <div style={{color:'var(--muted)',fontSize:'.95rem',marginBottom:'2rem'}}>{label}</div>
      <div style={{textAlign:'left',marginBottom:'2rem',maxWidth:'340px',margin:'0 auto 2rem'}}>
        {items.map((item,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:'.75rem',padding:'.5rem 0',borderBottom:'1px solid rgba(255,255,255,.05)'}}>
            <span style={{color:'var(--jade)',fontSize:'.9rem'}}>✓</span>
            <span style={{fontSize:'.875rem',color:'var(--muted)'}}>{item}</span>
          </div>
        ))}
      </div>
      <a href="Dashboard.html" className="lg btn btn-lg btn-ember" style={{display:'inline-block',marginTop:'1rem'}}>
        Begin Learning →
      </a>
    </div>
  );
}

function App(){
  const [step,setStep]=useState(1);
  const [goal,setGoal]=useState(null);
  const [targetLevel,setTargetLevel]=useState(null);

  return(
    <div className="ob-page">
      <ProgressBar step={step-1} total={2}/>
      <a href="../Velorah Hero.html" className="ob-logo">Nihongo<em style={{fontStyle:'normal',color:'var(--muted)'}}>Master</em></a>

      {step===1&&<Step1 onNext={g=>{setGoal(g);setStep(g==='jlpt'?2:3);}}/>}
      {step===2&&<Step2 goal={goal} onNext={l=>{setTargetLevel(l);setStep(3);}}/>}
      {step===3&&<Step3 goal={goal} level={targetLevel||'N5'}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
