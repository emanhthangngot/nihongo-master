<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NihongoMaster — Reading</title>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.reading-page{min-height:100vh;padding-bottom:80px}
.filter-bar{position:sticky;top:64px;z-index:30;padding:.75rem 2rem;border-bottom:1px solid var(--border);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;background:rgba(0,20,40,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card-grid{max-width:72rem;margin:0 auto;padding:2rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
@media(max-width:900px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.card-grid{grid-template-columns:1fr}}
.reading-card{border-radius:1.25rem;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.reading-card:hover{transform:scale(1.02);box-shadow:0 0 0 1px rgba(249,115,22,.4)}
.card-art{height:160px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-body{padding:1.1rem}
.read-page{max-width:100vw;min-height:100vh;display:flex;padding-bottom:80px}
.vocab-sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);padding:1.25rem;overflow-y:auto}
@media(max-width:900px){.vocab-sidebar{display:none}}
.read-content{flex:1;max-width:640px;margin:0 auto;padding:2.5rem 2rem}
.jp-text{font-family:var(--font-jp);font-size:1.1rem;line-height:2.4;color:var(--fg)}
.jp-word{cursor:pointer;border-radius:3px;transition:background .15s;padding:0 1px}
.jp-word:hover{background:rgba(249,115,22,.2)}
.jp-word.unknown{background:rgba(249,115,22,.12);text-decoration:underline;text-decoration-color:rgba(249,115,22,.4);text-underline-offset:3px}
.lookup-pop{position:fixed;z-index:100;border-radius:.875rem;padding:1rem;min-width:220px;max-width:260px;pointer-events:auto}
.quiz-section{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)}
.q-option{border-radius:.875rem;padding:.9rem 1.1rem;cursor:pointer;margin-bottom:.6rem;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.02)}
.q-option:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
.q-option.correct{border-color:var(--jade);background:rgba(52,211,153,.1)}
.q-option.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef} = React;

const STORIES=[
  {id:1,title:'桜の下で',subtitle:'Under the Cherry Blossoms',jlpt:'N4',genre:'Story',time:'~8 min',progress:42,
   gradient:'linear-gradient(135deg,rgba(249,115,22,.2),rgba(236,72,153,.15),rgba(0,20,40,1))',
   char:'桜',
   paragraphs:[
     {text:'春が来るたびに、田中は公園に行く。桜の花びらが空に舞い、風が優しく吹いている。',words:['春','公園','桜','花びら','空','風']},
     {text:'彼は木の下に座って、静かに本を読む。周りの人たちはみんな笑顔で、子どもたちが走り回っている。',words:['木','静か','本','笑顔','子ども']},
     {text:'「毎年ここに来るの、楽しみにしているんだ」と田中は独り言を言った。桜は毎年同じように咲くが、見る人の気持ちはいつも違う。',words:['毎年','楽しみ','独り言','気持ち']},
   ],
   questions:[
     {q:'田中はどこに行きますか？',options:['図書館','公園','学校','会社'],correct:1},
     {q:'田中は木の下で何をしますか？',options:['寝る','食べる','本を読む','音楽を聴く'],correct:2},
     {q:'桜についての田中の気持ちは？',options:['怖い','嫌い','好き','知らない'],correct:2},
   ]},
  {id:2,title:'雨の日の電車',subtitle:'Train on a Rainy Day',jlpt:'N5',genre:'Story',time:'~5 min',progress:0,
   gradient:'linear-gradient(135deg,rgba(56,189,248,.15),rgba(99,102,241,.12),rgba(0,20,40,1))',char:'雨',
   paragraphs:[
     {text:'今日は雨が降っています。山田さんは駅で電車を待っています。傘を持ってきて良かったと思いました。',words:['雨','駅','電車','傘']},
   ],
   questions:[
     {q:'今日の天気はどうですか？',options:['晴れ','曇り','雨','雪'],correct:2},
   ]},
  {id:3,title:'新しい仕事',subtitle:'A New Job',jlpt:'N3',genre:'Dialog',time:'~10 min',progress:0,
   gradient:'linear-gradient(135deg,rgba(52,211,153,.12),rgba(56,189,248,.1),rgba(0,20,40,1))',char:'仕',
   paragraphs:[
     {text:'来週から新しい会社で働きます。面接では緊張しましたが、なんとか合格することができました。',words:['会社','面接','緊張','合格']},
   ],
   questions:[
     {q:'この人はいつ新しい仕事を始めますか？',options:['今日','明日','来週','来月'],correct:2},
   ]},
  {id:4,title:'東京の夜',subtitle:'Tokyo at Night',jlpt:'N4',genre:'Story',time:'~12 min',progress:78,
   gradient:'linear-gradient(135deg,rgba(249,115,22,.1),rgba(147,51,234,.12),rgba(0,20,40,1))',char:'夜',
   paragraphs:[],questions:[]},
  {id:5,title:'日本の四季',subtitle:'Four Seasons of Japan',jlpt:'N5',genre:'News',time:'~6 min',progress:100,
   gradient:'linear-gradient(135deg,rgba(236,72,153,.12),rgba(249,115,22,.1),rgba(0,20,40,1))',char:'季',
   paragraphs:[],questions:[]},
  {id:6,title:'侍と刀',subtitle:'The Samurai and His Sword',jlpt:'N3',genre:'Story',time:'~15 min',progress:0,
   gradient:'linear-gradient(135deg,rgba(255,255,255,.06),rgba(100,116,139,.1),rgba(0,20,40,1))',char:'刀',
   paragraphs:[],questions:[]},
];

const UNKNOWN_WORDS=['桜','花びら','笑顔','独り言','気持ち'];

function Navbar({onBack}){
  return(
    <nav className="navbar lg">
      <div className="navbar-inner">
        <a href="../Velorah Hero.html" className="logo">Nihongo<em style={{fontStyle:'normal',color:'var(--muted)'}}>Master</em><sup>®</sup></a>
        <ul className="nav-links">
          <li><a href="Dashboard.html">Dashboard</a></li>
          <li><a href="Learning Path.html">Path</a></li>
          <li><a href="AI Tutor.html">AI Tutor</a></li>
          <li><a href="Flashcards.html">Flashcards</a></li>
          <li><a href="Dictionary.html">Dictionary</a></li>
        </ul>
        <div className="nav-right">
          <div className="streak keep-mobile">🔥 12</div>
          <button className="lg nav-cta btn">Quick Practice</button>
          <div className="avatar">你</div>
        </div>
      </div>
    </nav>
  );
}

function ReadingCard({story,onClick}){
  return(
    <div className="reading-card lg" onClick={onClick}>
      <div className="card-art" style={{background:story.gradient}}>
        <span style={{fontFamily:'var(--font-jp)',fontSize:'5rem',opacity:.25,position:'absolute'}}>{story.char}</span>
        <div style={{position:'relative',textAlign:'center'}}>
          <span className={`jlpt ${story.jlpt.toLowerCase()}`}>{story.jlpt}</span>
        </div>
      </div>
      <div className="card-body">
        <div style={{display:'flex',gap:'.4rem',marginBottom:'.6rem',flexWrap:'wrap'}}>
          <span className={`jlpt ${story.jlpt.toLowerCase()}`}>{story.jlpt}</span>
          <span style={{fontSize:'.7rem',color:'var(--muted)',padding:'.15rem .5rem',borderRadius:'9999px',background:'rgba(255,255,255,.05)'}}>{story.genre}</span>
          <span style={{fontSize:'.7rem',color:'var(--muted)',padding:'.15rem .5rem',borderRadius:'9999px',background:'rgba(255,255,255,.05)'}}>{story.time}</span>
        </div>
        <div style={{fontFamily:'var(--font-jp)',fontSize:'1.15rem',fontWeight:500,lineHeight:1.3}}>{story.title}</div>
        <div style={{fontSize:'.8rem',color:'var(--muted)',marginTop:'.3rem'}}>{story.subtitle}</div>
        {story.progress>0&&(
          <div style={{marginTop:'.85rem'}}>
            <div className="xpbar-track"><div className="xpbar-fill" style={{width:`${story.progress}%`,background:story.progress===100?'var(--jade)':'var(--ember)'}}/></div>
            <div style={{fontSize:'.7rem',color:'var(--muted)',marginTop:'.3rem'}}>{story.progress}% complete</div>
          </div>
        )}
      </div>
    </div>
  );
}

function LookupPopover({word,pos,onClose,onSRS}){
  return(
    <div className="lookup-pop lg" style={{background:'rgba(8,20,36,.97)',border:'1px solid rgba(255,255,255,.12)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.5rem'}}>
        <span style={{fontFamily:'var(--font-jp)',fontSize:'1.4rem'}}>{word}</span>
        <button style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'.9rem'}} onClick={onClose}>✕</button>
      </div>
      <div style={{fontFamily:'var(--font-m)',fontSize:'.75rem',color:'var(--muted)'}}>{word==='桜'?'さくら · cherry blossom':word==='花びら'?'はなびら · petal':word==='笑顔'?'えがお · smile; smiling face':word==='独り言'?'ひとりごと · talking to oneself':word==='気持ち'?'きもち · feeling; mood':'reading · meaning'}</div>
      <div style={{marginTop:'.75rem',display:'flex',gap:'.5rem'}}>
        <button className="lg btn btn-sm" onClick={onSRS} style={{fontSize:'.72rem',flex:1}}>+ Add to SRS</button>
        <a href="Dictionary.html" className="lg btn btn-sm" style={{fontSize:'.72rem'}}>Full Entry →</a>
      </div>
    </div>
  );
}

function ReadingMode({story,onBack}){
  const [popup,setPopup]=useState(null);
  const [popPos,setPopPos]=useState({x:0,y:0});
  const [answers,setAnswers]=useState({});
  const [quizDone,setQuizDone]=useState(false);
  const [srsAdded,setSrsAdded]=useState([]);
  const [vocabList,setVocabList]=useState([]);

  const handleWordClick=(word,e)=>{
    if(!UNKNOWN_WORDS.includes(word))return;
    const rect=e.target.getBoundingClientRect();
    setPopPos({x:rect.left,y:rect.bottom+8});
    setPopup(word);
    if(!vocabList.includes(word))setVocabList(v=>[...v,word]);
  };
  const handleSRS=(word)=>{
    setSrsAdded(s=>[...s,word]);
    setPopup(null);
  };

  const renderPara=(para)=>{
    let text=para.text;
    const parts=[];
    let i=0;
    while(i<text.length){
      let found=false;
      for(const w of para.words){
        if(text.slice(i).startsWith(w)){
          const isUnknown=UNKNOWN_WORDS.includes(w);
          parts.push(<span key={i} className={`jp-word${isUnknown?' unknown':''}`} onClick={e=>handleWordClick(w,e)}>{w}</span>);
          i+=w.length;found=true;break;
        }
      }
      if(!found){parts.push(text[i]);i++;}
    }
    return parts;
  };

  const handleAnswer=(qi,oi)=>{
    if(answers[qi]!==undefined)return;
    setAnswers(a=>({...a,[qi]:oi}));
    if(Object.keys(answers).length+1===story.questions.length)setTimeout(()=>setQuizDone(true),800);
  };

  return(
    <div className="read-page">
      <div className="vocab-sidebar" style={{background:'var(--surface)'}}>
        <div style={{fontSize:'.7rem',textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',marginBottom:'1rem'}}>Vocabulary Encountered</div>
        {vocabList.length===0&&<div style={{fontSize:'.8rem',color:'var(--muted)',lineHeight:1.6}}>Click on highlighted words to look them up.</div>}
        {vocabList.map(w=>(
          <div key={w} className="lg" style={{borderRadius:'.75rem',padding:'.6rem .85rem',marginBottom:'.5rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontFamily:'var(--font-jp)',fontSize:'1.1rem'}}>{w}</span>
            {srsAdded.includes(w)
              ?<span style={{fontSize:'.68rem',color:'var(--jade)'}}>✓ SRS</span>
              :<button className="lg btn btn-sm" style={{fontSize:'.65rem',padding:'.2rem .55rem'}} onClick={()=>handleSRS(w)}>+SRS</button>}
          </div>
        ))}
      </div>

      <div className="read-content">
        <button onClick={onBack} style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',marginBottom:'1.5rem',fontSize:'.8rem'}}>← Library</button>
        <div style={{display:'flex',gap:'.5rem',marginBottom:'.75rem',flexWrap:'wrap'}}>
          <span className={`jlpt ${story.jlpt.toLowerCase()}`}>{story.jlpt}</span>
          <span style={{fontSize:'.75rem',color:'var(--muted)'}}>{story.time}</span>
        </div>
        <div style={{fontFamily:'var(--font-d)',fontSize:'2rem',lineHeight:1.1}} className="fr">{story.title}</div>
        <div style={{color:'var(--muted)',fontSize:'.9rem',marginTop:'.35rem',marginBottom:'1.5rem'}} className="fr1">{story.subtitle}</div>
        <hr style={{border:'none',borderTop:'1px solid var(--border)',marginBottom:'2rem'}}/>

        {story.paragraphs.map((para,i)=>(
          <p key={i} className="jp-text" style={{marginBottom:'1.75rem'}}>
            {renderPara(para)}
          </p>
        ))}

        {story.paragraphs.length===0&&(
          <div style={{color:'var(--muted)',fontStyle:'italic'}}>Full text available in the complete app.</div>
        )}

        {/* Quiz */}
        {story.questions.length>0&&(
          <div className="quiz-section fr">
            <div style={{fontFamily:'var(--font-jp)',fontSize:'1.5rem',marginBottom:'.3rem'}}>理解チェック</div>
            <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--muted)',marginBottom:'1.5rem'}}>Comprehension Check</div>
            {story.questions.map((q,qi)=>(
              <div key={qi} style={{marginBottom:'1.5rem'}}>
                <div style={{fontSize:'.9rem',marginBottom:'.6rem',fontFamily:'var(--font-b)'}}>{q.q}</div>
                {q.options.map((opt,oi)=>{
                  const answered=answers[qi]!==undefined;
                  const cls=answered?(oi===q.correct?'correct':oi===answers[qi]?'wrong':''):'';
                  return(
                    <div key={oi} className={`q-option${cls?' '+cls:''}`} onClick={()=>handleAnswer(qi,oi)}>
                      <span style={{fontFamily:opt.match(/[\u3000-\u9fff]/)?'var(--font-jp)':'var(--font-b)'}}>{opt}</span>
                    </div>
                  );
                })}
              </div>
            ))}
            {quizDone&&(
              <div style={{background:'rgba(52,211,153,.1)',border:'1px solid rgba(52,211,153,.4)',borderRadius:'1rem',padding:'1.25rem',textAlign:'center',marginTop:'1rem'}}>
                <div style={{fontSize:'1.5rem',marginBottom:'.5rem'}}>🎉</div>
                <div style={{fontFamily:'var(--font-d)',fontSize:'1.25rem'}}>Well done! +50 XP</div>
                <div style={{color:'var(--muted)',fontSize:'.8rem',marginTop:'.3rem'}}>Comprehension complete</div>
              </div>
            )}
          </div>
        )}
      </div>

      {popup&&(
        <>
          <div style={{position:'fixed',inset:0,zIndex:99}} onClick={()=>setPopup(null)}/>
          <div style={{position:'fixed',left:Math.min(popPos.x,window.innerWidth-280),top:popPos.y,zIndex:100}}>
            <LookupPopover word={popup} onClose={()=>setPopup(null)} onSRS={()=>handleSRS(popup)}/>
          </div>
        </>
      )}
    </div>
  );
}

function App(){
  const [story,setStory]=useState(null);
  const [levelFilter,setLevelFilter]=useState(null);
  const [genreFilter,setGenreFilter]=useState(null);

  const filtered=STORIES.filter(s=>{
    if(levelFilter&&s.jlpt!==levelFilter)return false;
    if(genreFilter&&s.genre!==genreFilter)return false;
    return true;
  });

  return(
    <div className="reading-page">
      <Navbar/>
      {!story?(
        <>
          <div className="filter-bar">
            <span style={{fontSize:'.75rem',color:'var(--muted)',marginRight:'.5rem'}}>Level:</span>
            {['N5','N4','N3','N2','N1'].map(l=>(
              <button key={l} className={`pill${levelFilter===l?' active':''}`} style={{padding:'.25rem .7rem',fontSize:'.75rem'}} onClick={()=>setLevelFilter(levelFilter===l?null:l)}>{l}</button>
            ))}
            <div style={{width:'1px',height:'20px',background:'var(--border)',margin:'0 .25rem'}}/>
            <span style={{fontSize:'.75rem',color:'var(--muted)',marginRight:'.5rem'}}>Genre:</span>
            {['Story','News','Dialog'].map(g=>(
              <button key={g} className={`pill${genreFilter===g?' active':''}`} style={{padding:'.25rem .7rem',fontSize:'.75rem'}} onClick={()=>setGenreFilter(genreFilter===g?null:g)}>{g}</button>
            ))}
          </div>
          <div className="card-grid">
            {filtered.map(s=><ReadingCard key={s.id} story={s} onClick={()=>setStory(s)}/>)}
          </div>
        </>
      ):(
        <ReadingMode story={story} onBack={()=>setStory(null)}/>
      )}

      <nav className="mobile-nav lg">
        <a href="Dashboard.html"><span>🏠</span><span>Home</span></a>
        <a href="Learning Path.html"><span>📚</span><span>Path</span></a>
        <a href="Flashcards.html"><span>🃏</span><span>Cards</span></a>
        <a href="AI Tutor.html"><span>🤖</span><span>Tutor</span></a>
        <a href="Dictionary.html"><span style={{fontFamily:'var(--font-jp)'}}>辞</span><span>Dict</span></a>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
