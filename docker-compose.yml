version: "3.9"

services:

  # ─── Supabase (local dev) ────────────────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.1.1.41
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Ollama (local LLM) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # On NVIDIA GPU host, add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── Backend (Node.js) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://supabase-db:5432
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
    depends_on:
      supabase-db: { condition: service_healthy }
      redis:       { condition: service_healthy }

  # ─── AI Service (FastAPI) ───────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@supabase-db:5432/postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      supabase-db: { condition: service_healthy }
      redis:       { condition: service_healthy }

  # ─── Frontend (Vite) ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ai-service

volumes:
  supabase_data:
  redis_data:
  ollama_data: